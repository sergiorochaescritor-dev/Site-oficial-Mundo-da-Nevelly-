<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mundo da Nevelly</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background: linear-gradient(180deg, #ffe4f3, #f6d9ff);
  overflow-x: hidden;
}

/* ===================== */
/* 🌟 ABERTURA */
/* ===================== */
#splash {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, #ff8fd8, #b76cff);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 9999;
  animation: splashOut 1.5s ease forwards;
  animation-delay: 4s;
}

/* estrela */
.star-logo {
  width: 140px;
  height: 140px;
  background: linear-gradient(135deg, #fff1a8, #ff8fd8);
  clip-path: polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 91%,
    50% 70%,
    21% 91%,
    32% 57%,
    2% 35%,
    39% 35%
  );
  animation: starSpin 3s infinite ease-in-out;
}

.logo-name {
  margin-top: 25px;
  font-size: 4.5rem;
  font-weight: bold;
  letter-spacing: 4px;
  background: linear-gradient(135deg, #ffffff, #ffd6f3);
  -webkit-background-clip: text;
  color: transparent;
  animation: floatText 2.5s infinite ease-in-out;
}

/* ===================== */
/* 🌟 HERO */
/* ===================== */
.hero {
  height: 100vh;
  background: linear-gradient(135deg, #ff8fd8, #b76cff);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.hero h1 {
  font-size: 5rem;
  animation: floatText 3s infinite ease-in-out;
}

.hero p {
  font-size: 1.7rem;
  max-width: 700px;
}

/* bolhas e estrelas */
.bubble {
  position: absolute;
  border-radius: 50%;
  opacity: 0.4;
  animation: bubbleFloat 10s infinite ease-in-out;
}

.bubble.star {
  clip-path: polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 91%,
    50% 70%,
    21% 91%,
    32% 57%,
    2% 35%,
    39% 35%
  );
}
